apiVersion: apps/v1
kind: Deployment

metadata:
  name: document-analyzer
  namespace: miniproject-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: document-analyzer

  template:
    metadata:
      labels:
        app: document-analyzer

    spec:
      # backend 와 동일 IRSA — IAM Trust 가 backend-sa 기준이면 analyzer 도 이 SA 를 써야 S3·STS 가 통과함
      serviceAccountName: backend-sa

      containers:
        - name: document-analyzer

          image: 804540872991.dkr.ecr.ap-northeast-2.amazonaws.com/miniproject-management/document-analyzer:latest

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: AWS_REGION
              value: ap-northeast-2

            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_BUCKET_NAME

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_PASSWORD

            # Gemini (백엔드와 동일 backend-secret 키 — 이력서 분석에 필수)
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: GOOGLE_API_KEY

          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
