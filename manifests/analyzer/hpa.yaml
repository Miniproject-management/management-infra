apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: document-analyzer-hpa
  namespace: miniproject-management

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document-analyzer

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70