apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: miniproject-management
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::804540872991:role/miniproject-management-backend-sa-role-2team

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: miniproject-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa

      containers:
        - name: backend
          image: 804540872991.dkr.ecr.ap-northeast-2.amazonaws.com/miniproject-management/backend:e075fe3fd195f06d1ec3db8c5d6d4cd340b71e53
          ports:
            - containerPort: 8080

          envFrom:
          - configMapRef:
              name: backend-config

          env:
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_BUCKET_NAME

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_PASSWORD

          # actuator 준비 전까지 임시 제거 추천
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 30
          #   periodSeconds: 10

          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 60
          #   periodSeconds: 30

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service

metadata:
  name: backend-service
  namespace: miniproject-management

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - port: 8080
      targetPort: 8080