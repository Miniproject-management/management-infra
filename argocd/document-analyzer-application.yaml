apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: document-analyzer
  namespace: argocd

spec:
  project: default

  source:
    repoURL: "https://github.com/Miniproject-management/management-infra.git"
    targetRevision: main
    path: 'manifests/analyzer'

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: miniproject-management

  syncPolicy:
    automated:
      prune: true
      selfHeal: true